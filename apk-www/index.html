<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e27">
<title>李亦禾</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #0a0e27 0%, #1a1f3a 100%);
    color: #e0e0e0; min-height: 100vh; overflow-x: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  /* Setup Screen */
  .setup-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 20px; gap: 20px;
  }
  .setup-screen .logo {
    width: 80px; height: 80px; border-radius: 20px;
    background: linear-gradient(135deg, #1a1f3a, #0a0e27);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: #ffd97a; margin-bottom: 10px;
  }
  .setup-screen h1 { color: #7ec8ff; font-size: 24px; }
  .setup-screen p { color: #666; font-size: 14px; text-align: center; line-height: 1.6; }
  .setup-screen input {
    width: 100%; max-width: 300px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
    padding: 14px 18px; color: #fff; font-size: 16px; outline: none;
  }
  .setup-screen input::placeholder { color: #555; }
  .setup-screen button {
    background: #2563eb; border: none; border-radius: 12px;
    padding: 14px 40px; color: #fff; font-size: 16px; cursor: pointer;
  }
  .setup-screen button:active { transform: scale(0.95); }
  /* Chat UI */
  .header {
    background: rgba(255,255,255,0.05); padding: 12px 20px;
    text-align: center; position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .header h1 { font-size: 18px; color: #7ec8ff; }
  .header .status { font-size: 11px; color: #666; }
  .header .settings-btn {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #666; font-size: 20px; cursor: pointer;
  }
  .chat {
    padding: 16px; padding-bottom: 100px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 85%; padding: 12px 16px; border-radius: 16px;
    font-size: 16px; line-height: 1.5; word-break: break-all;
    animation: slideIn 0.3s ease;
  }
  .msg.user {
    align-self: flex-end; background: #2563eb; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start; background: rgba(255,255,255,0.1);
    border-bottom-left-radius: 4px;
  }
  .msg.status {
    align-self: center; background: transparent; color: #666;
    font-size: 13px; font-style: italic;
  }
  .msg .time { font-size: 10px; opacity: 0.5; margin-top: 4px; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .input-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,14,39,0.95); padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; gap: 8px; align-items: center;
  }
  .input-bar input {
    flex: 1; background: rgba(255,255,255,0.1); border: none;
    border-radius: 24px; padding: 12px 18px; color: #fff;
    font-size: 16px; outline: none;
  }
  .input-bar input::placeholder { color: #555; }
  .input-bar button {
    background: #2563eb; border: none; border-radius: 50%;
    width: 44px; height: 44px; color: #fff;
    font-size: 20px; cursor: pointer; flex-shrink: 0;
  }
  .input-bar button:active { transform: scale(0.9); }
  .quick-bar {
    display: flex; gap: 8px; padding: 8px 16px;
    overflow-x: auto; white-space: nowrap;
  }
  .quick-btn {
    background: rgba(126,200,255,0.15); border: 1px solid rgba(126,200,255,0.3);
    border-radius: 16px; padding: 6px 14px; color: #7ec8ff;
    font-size: 13px; cursor: pointer; flex-shrink: 0;
  }
  .quick-btn:active { background: rgba(126,200,255,0.3); }
</style>
</head>
<body>

<!-- Setup Screen -->
<div class="setup-screen" id="setupScreen">
  <div class="logo">亦</div>
  <h1>李亦禾 AI 助手</h1>
  <p>请输入电脑服务器的 IP 地址<br>（在电脑终端中会显示访问地址）</p>
  <input type="text" id="ipInput" placeholder="例如 192.168.1.3" value="">
  <button onclick="connectServer()">连接</button>
</div>

<!-- Chat UI (hidden until connected) -->
<div id="chatUI" style="display:none">
  <div class="header">
    <h1>✨ 李亦禾</h1>
    <div class="status" id="status">连接中...</div>
    <button class="settings-btn" onclick="showSetup()">⚙</button>
  </div>
  <div class="quick-bar">
    <button class="quick-btn" onclick="sendMsg('现在几点了')">几点了</button>
    <button class="quick-btn" onclick="sendMsg('今天天气怎么样')">天气</button>
    <button class="quick-btn" onclick="sendMsg('帮我打开浏览器')">打开浏览器</button>
    <button class="quick-btn" onclick="sendMsg('搜索今日新闻')">搜新闻</button>
    <button class="quick-btn" onclick="sendMsg('记一下今天很开心')">记一笔</button>
    <button class="quick-btn" onclick="sendMsg('今天有点累')">聊聊天</button>
  </div>
  <div class="chat" id="chat"></div>
  <div class="input-bar">
    <input type="text" id="input" placeholder="跟李亦禾说点什么..."
      onkeydown="if(event.key==='Enter')doSend()">
    <button onclick="doSend()">➤</button>
  </div>
</div>

<script>
let SERVER_URL = localStorage.getItem('liyihe_server') || '';
let es = null;

const setupScreen = document.getElementById('setupScreen');
const chatUI = document.getElementById('chatUI');
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const ipInput = document.getElementById('ipInput');

// Auto-connect if IP is saved
if (SERVER_URL) {
  ipInput.value = SERVER_URL.replace('http://','').replace(':5000','');
  connectServer();
}

function connectServer() {
  let ip = ipInput.value.trim();
  if (!ip) { alert('请输入 IP 地址'); return; }
  if (!ip.startsWith('http')) ip = 'http://' + ip;
  if (!ip.includes(':')) ip += ':5000';
  SERVER_URL = ip;
  localStorage.setItem('liyihe_server', SERVER_URL);
  
  setupScreen.style.display = 'none';
  chatUI.style.display = 'block';
  
  addMsg('status', '正在连接服务器...');
  startSSE();
}

function showSetup() {
  if (es) { es.close(); es = null; }
  chatUI.style.display = 'none';
  setupScreen.style.display = 'flex';
  ipInput.value = SERVER_URL.replace('http://','').replace(':5000','');
}

function startSSE() {
  if (es) es.close();
  try {
    es = new EventSource(SERVER_URL + '/stream');
    es.onopen = function() { statusEl.textContent = '已连接'; statusEl.style.color = '#4ade80'; };
    es.onerror = function() { statusEl.textContent = '连接中断'; statusEl.style.color = '#f87171'; };
    es.onmessage = function(e) {
      const msg = JSON.parse(e.data);
      addMsg(msg.role, msg.text, msg.timestamp);
    };
  } catch(e) {
    statusEl.textContent = '连接失败'; statusEl.style.color = '#f87171';
  }
}

function addMsg(role, text, time) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = (role === 'user' ? '🗣 ' : role === 'assistant' ? '✨ ' : '') + text
    + '<div class="time">' + (time || '') + '</div>';
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

function doSend() {
  const text = input.value.trim();
  if (!text) return;
  sendMsg(text);
  input.value = '';
}

function sendMsg(text) {
  fetch(SERVER_URL + '/send', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: text})
  }).catch(function() {
    addMsg('status', '发送失败，请检查服务器是否运行');
  });
}
</script>
</body>
</html>
